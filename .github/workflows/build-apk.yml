name: Build LampuWidget APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LampuWidget-AndroidStudio.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: unzip -o LampuWidget-AndroidStudio.zip

      - name: Fix widget XML
        run: |
          cat > LampuWidget/app/src/main/res/xml/lamp_widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget_lamp"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

      - name: Set Java and Kotlin JVM target to 17
        run: |
          cat > LampuWidget/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.arul.lampuwidget"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.arul.lampuwidget"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5")
          }
          EOF

      - name: Build debug APK
        run: gradle -p LampuWidget :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LampuWidget-APK
          path: LampuWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
